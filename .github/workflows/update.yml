name: Update Devin CLI

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for update
        run: bash update.sh

      - name: Commit and push
        id: push
        run: |
          git diff --quiet manifest.json && exit 0
          version=$(jq -r .version manifest.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json README.md
          git commit -m "Update Devin CLI to ${version}"
          git tag -a "${version}" -m "Devin CLI ${version}"
          git push origin main "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Trigger FlakeHub publish
        if: steps.push.outputs.version
        run: gh workflow run flakehub-publish-tagged.yml -f tag="${{ steps.push.outputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
